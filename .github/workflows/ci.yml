name: CI

on:
  push:
    branches:
      - main
      - feature/ci
  pull_request:
    branches:
      - main
      - feature/ci

jobs:
  lint-and-type-check:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v6

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🔒 Audit dependencies
      run: npm run check:security

    - name: 🧹 Run ESLint
      run: npm run lint

    - name: 🔍 Run TypeScript checking
      run: npm run type-check

    - name: ✂️ Check unused code and dependencies
      run: npm run check:unused

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v6

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 📊 Run all tests with coverage
      run: npm run test:coverage

    - name: 📈 Store coverage report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: coverage-report
        path: coverage/
        retention-days: 14

  database:
    name: Database Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pmc_plan_dev
          POSTGRES_PASSWORD: pmc_plan
          POSTGRES_USER: pmc_plan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmc_plan -d pmc_plan_dev"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://pmc_plan:pmc_plan@localhost:5432/pmc_plan_dev
      POSTGRES_URL_NON_POOLING: postgresql://pmc_plan:pmc_plan@localhost:5432/pmc_plan_dev
      DEV_DISCORD_ID: '900000000000000099'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v6

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🗃️ Apply database migrations
      run: npm run db:apply

    - name: 👤 Bootstrap development identity
      run: npm run db:bootstrap

    - name: 🔎 Verify schema and development identity
      run: |
        npm run db:verify
        npm run db:check

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v6

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🏗️ Build for production
      run: npm run build
